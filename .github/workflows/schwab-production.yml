name: Publish Schwab yields

on:
  workflow_dispatch:
  schedule:
    # 8:17 AM Eastern during daylight time; 7:17 AM during standard time.
    # The non-round minute reduces peak-hour scheduling delays.
    - cron: "17 12 * * *"

permissions:
  contents: write

concurrency:
  group: schwab-yield-publisher
  cancel-in-progress: false

jobs:
  publish-linux:
    name: Retrieve and publish from Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scrape-outcome: ${{ steps.scrape.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Retrieve and validate Schwab yields
        id: scrape
        continue-on-error: true
        run: python schwab_scraper.py --output data/schwab_yields.json

      - name: Commit the validated public JSON
        if: ${{ steps.scrape.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schwab_yields.json
          if git diff --cached --quiet; then
            echo "The published JSON is already current."
          else
            git commit -m "Update Schwab yields"
            git push
          fi

      - name: Upload failure diagnostics
        if: ${{ steps.scrape.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: schwab-production-linux-failure
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

  publish-macos-fallback:
    name: Retrieve and publish from macOS fallback
    needs: publish-linux
    if: ${{ always() && needs.publish-linux.outputs.scrape-outcome == 'failure' }}
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Retrieve and validate Schwab yields
        run: python schwab_scraper.py --output data/schwab_yields.json

      - name: Commit the validated public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schwab_yields.json
          if git diff --cached --quiet; then
            echo "The published JSON is already current."
          else
            git commit -m "Update Schwab yields (macOS fallback)"
            git push
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schwab-production-macos-failure
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
